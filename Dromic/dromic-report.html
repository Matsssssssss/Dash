<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typhoon Dashboard</title>
    <link rel="icon" type="image/png" href="../Images/PCDAC.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../supportFiles/css/dromic.css">
    <link rel="stylesheet" href="../supportFiles/css/navBar.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
    <script src="../supportFiles/js/dromic.js" defer></script>
    <script src="../supportFiles/js/navBar.js" defer></script>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>
<body>
    <nav class="top-nav">
        <div class="brand">
            <img class="brandLogo" src="../Images/IPG.png" alt="IPG Logo">
            <p class="brandTitle">Provincial Community Defense Action Center<p>
        </div>

        <button class="menu-toggle" id="menuToggle">
        ☰
        </button>

        <ul class="nav-links" id="navLinks">
            <li><a href="../index.html">Typhoon</a></li>
            <li><a href="../Agriculture/agricultural-damage.html">Agriculture</a></li>
            <li><a href="dromic-report.html">iMap</a></li>
            <li><a href="../SitRep/situationalReports.html">Report</a></li>
        </ul>
    </nav>  <!--This is the end of top navigation bar-->

    <main class="dashboard">
    
    <section class="sumarry-reports">
        <div class="map-interface">
            <!-- VEHICLE LIST SIDEBAR -->
            <aside class="vehicle-sidebar" id="vehicleSidebar">
                <div class="vehicle-sidebar-header">
                    <h3>Vehicles</h3>
                    <span id="vehicleCount">0</span>
                </div>

                <!-- SEARCH VEHICLES -->
                <div class="vehicle-search">
                    <input
                        type="text"
                        id="vehicleSearch"
                        placeholder="Search vehicles..."
                    >
                </div>

                <!-- FILTERS -->
                <div class="vehicle-filters">

                    <select id="vehicleTypeFilter">
                        <option value="all">
                            ALL Vehicle Types
                        </option>
                    </select>

                    <select id="branchFilter">
                        <option value="all">
                            All Branches
                        </option>
                    </select>

                    <select id="statusFilter">
                        <option value="all">
                            All Status
                        </option>
                    </select>
                </div>

                <!-- SHOW / HIDE -->
                <div class="vehicle-visibility-controls">

                    <button
                        type="button"
                        id="showAllVehicles"
                    >
                        Show All
                    </button>

                    <button
                        type="button"
                        id="hideAllVehicles"
                    >
                        Hide All
                    </button>
                </div>

                <!-- VEHICLE LIST -->
                <div class="vehicle-list" id="vehicleList">

                </div>
            </aside>

            <!-- MAP -->
            <div id="iMap" class="vehicle-map"></div>
        </section>
    </main>
</body>
</html>
