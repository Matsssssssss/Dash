<body>
    <nav class="top-nav">
        <div class="brand">
            <img class="brandLogo" src="../Images/IPG.png" alt="IPG Logo">
            <p class="brandTitle">Provincial Community Defense Action Center<p>
        </div>

        <button class="menu-toggle" id="menuToggle">
        ☰

        <ul class="nav-links" id="navLinks">
            <li><a href="../index.html">Typhoon</a></li>
            <li><a href="../Agriculture/agricultural-damage.html">Agriculture</a></li>
            <li><a href="dromic-login.html">iMap</a></li>
            <li><a href="../SitRep/situationalReports.html">Report</a></li>
        </ul>
    </nav>

    <main class="dashboard">
        <section class="sumarry-reports">
            <div class="login-container">
                <h2>Login</h2>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" placeholder="Enter your username" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" id="loginButton" class="login-button">Login</button>
                </form>

                <p id="message"></p>
            </div>
        </section>

    <script>
        const loginForm = document.getElementById("loginForm");
        const message = document.getElementById("message");
        const loginButton = document.getElementById("loginButton");

        loginForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            //message.textContent = "";
            loginButton.disabled = true;
            loginButton.textContent = "Logging in...";

            try {
                const response = await fetch("/api/login", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    credentials: "include", body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                const data = await response.json();

                // LOGIN SUCCESSFUL
                if (response.ok) { 
                    message.textContent = "Login successful!"; 

                    setTimeout(() => {window.location.href = ("dromic-report.html");}, 500);
                }

                // LOGIN FAILED
                else { 
                    message.textContent = data.message || "Invalid username or password."; 
                }
            } 

            catch (error) {
                console.error(error); message.textContent = "Unable to connect to the server."; 
            }

            loginButton.disabled = false;
            loginButton.textContent = "Login";
        });
    </script>
    </main>
</body>
</html>
